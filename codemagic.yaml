workflows:
  studymate-android-debug:
    name: StudyMate Android Debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Check project files
        script: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
      - name: Run unit tests and build debug APK
        script: |
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/test-results/testDebugUnitTest/**/*.xml
